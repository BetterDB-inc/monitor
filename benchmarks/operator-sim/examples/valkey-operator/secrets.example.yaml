# Replace every CHANGE_ME, then: kubectl apply -f secrets.yaml
# (namespaces must exist: kubectl create ns valkey; kubectl create ns betterdb)
apiVersion: v1
kind: Secret
metadata: { name: valkey-users, namespace: valkey }   # same namespace as the ValkeyCluster
type: Opaque
stringData:
  betterdb: CHANGE_ME_valkey_password
---
apiVersion: v1
kind: Secret
metadata: { name: betterdb, namespace: betterdb }
type: Opaque
stringData:
  valkey-password: CHANGE_ME_valkey_password          # same value as above
  pg-password: CHANGE_ME_pg_password
  storage-url: postgresql://betterdb:CHANGE_ME_pg_password@postgres:5432/betterdb
  encryption-key: CHANGE_ME_at_least_16_chars          # encrypts the stored node credentials
  license-key: CHANGE_ME_license_key                   # Pro: anomaly detection (see README)
