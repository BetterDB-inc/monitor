global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'betterdb-monitor'
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels:
          instance: 'local'
          environment: 'dev'
    # Set when the monitor runs with PROMETHEUS_METRICS_TOKEN:
    # authorization:
    #   type: Bearer
    #   credentials: '<PROMETHEUS_METRICS_TOKEN>'
