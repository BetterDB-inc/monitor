global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The monitor's own exposition endpoint.
  - job_name: 'betterdb'
    metrics_path: '/api/prometheus/metrics'
    static_configs:
      - targets: ['betterdb:3001']
    # Uncomment when the monitor runs with PROMETHEUS_METRICS_TOKEN:
    # authorization:
    #   type: Bearer
    #   credentials: '<PROMETHEUS_METRICS_TOKEN>'

  # The same series after a round trip through the OTLP mirror and Collector.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
