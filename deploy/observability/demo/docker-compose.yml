# Side-by-side demo: Valkey under load, BetterDB Monitor scraping it, the OTel
# Collector taking the OTLP mirror, Prometheus scraping both, Grafana showing
# the shipped dashboard pack. Run with: docker compose up -d
#
# DEMO ONLY — not a deployment template. It hardcodes a Valkey password in
# plain text, serves Grafana with anonymous admin access and embedding
# enabled, and publishes every port to the host without TLS. Do not copy it
# into a shared or production environment.
services:
  valkey:
    image: valkey/valkey:8-alpine
    command: >
      valkey-server
      --requirepass demopassword
      --slowlog-log-slower-than 0
      --commandlog-request-larger-than 100
      --commandlog-reply-larger-than 100
    healthcheck:
      test: ['CMD', 'valkey-cli', '-a', 'demopassword', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  betterdb:
    image: betterdb/monitor:latest
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      - DB_HOST=valkey
      - DB_PORT=6379
      - DB_PASSWORD=demopassword
      - PROMETHEUS_POLL_INTERVAL_MS=5000
      - OTEL_TELEMETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_METRICS_EXPORT_INTERVAL_MS=15000
    ports:
      - '3001:3001'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - '../collector/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro'
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=6h'
    volumes:
      - './prometheus.yml:/etc/prometheus/prometheus.yml:ro'
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - './grafana/provisioning:/etc/grafana/provisioning:ro'
      - '../dashboards:/var/lib/grafana/dashboards:ro'
    ports:
      - '3000:3000'
