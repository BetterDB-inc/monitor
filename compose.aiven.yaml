# compose.aiven.yaml — BetterDB Monitor on Aiven Runtime
#
# This is the RUNTIME-facing compose file. It is NOT for `docker compose up`
# locally — use docker-compose.yml for that. Point the Aiven Console at THIS
# file when creating the Runtime application (Runtime > Deploy application >
# scan compose.aiven.yaml).
#
# How it differs from docker-compose.yml:
#   - It contains the BetterDB Monitor APP (built from the repo Dockerfile),
#     which docker-compose.yml does not.
#   - Valkey (the database being monitored) and PostgreSQL (audit storage) are
#     declared as bare `image:` services. Runtime's Compose scanner DETECTS
#     these and provisions them as MANAGED Aiven services instead of running
#     them as containers — so no passwords live in this file.
#   - The USER / PASSWORD / host placeholders below are filled in by Runtime
#     from the bound managed services; set the actual secrets (AUTH_SECRET,
#     DB_PASSWORD, STORAGE_URL) in the Runtime application's settings.
#
# Suggested Runtime sizing:
#   - App: 1 replica, ~1 GiB RAM, public HTTP port 3001.
#   - Valkey (target to monitor): >= 1 GiB. Version 8.x for native COMMANDLOG /
#     CLUSTER SLOT-STATS support.
#   - PostgreSQL (audit storage): version 16, defaultdb.
#
# AI features (Ollama-backed) are intentionally OFF here: this builds the
# `production-no-ai` image target, so no 8 GiB model service is required.

services:
  betterdb-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-no-ai
      # args:
      #   APP_VERSION: "0.44.0"
    ports:
      - "3001:3001"
    depends_on:
      - betterdb-valkey
      - betterdb-postgres
    environment:
      NODE_ENV: production
      PORT: "3001"

      # --- Target database to MONITOR (the managed Aiven Valkey below) ---
      DB_TYPE: valkey
      DB_HOST: betterdb-valkey
      DB_PORT: "6379"
      DB_USERNAME: default
      DB_PASSWORD: PASSWORD        # injected by Runtime from the bound Valkey

      # --- Audit storage (the managed Aiven PostgreSQL below) ---
      STORAGE_TYPE: postgres
      STORAGE_URL: postgresql://USER:PASSWORD@betterdb-postgres:5432/defaultdb

      # --- App auth / misc ---
      AUTH_SECRET: CHANGE_ME       # set as a secret in Runtime
      AUTH_PUBLIC_URL: https://your-app.aiven.run   # set to the Runtime app URL
      AI_ENABLED: "false"

  # Managed services: Runtime auto-detects these images and provisions the
  # real Aiven services. Do not add credentials here.
  betterdb-valkey:
    image: valkey/valkey:8

  betterdb-postgres:
    image: postgres:16
