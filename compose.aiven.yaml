# compose.aiven.yaml — BetterDB Monitor on Aiven Runtime
#
# This is the RUNTIME-facing compose file. It is NOT for `docker compose up`
# locally — use docker-compose.yml for that. Point the Aiven Console at THIS
# file when creating the Runtime application (Runtime > Deploy application >
# scan compose.aiven.yaml).
#
# Topology:
#   - betterdb-monitor: the APP, built from the repo Dockerfile.
#   - betterdb-postgres: audit storage, declared as a bare `image:` service so
#     Runtime's Compose scanner provisions it as a MANAGED Aiven PostgreSQL
#     (no passwords live in this file — Runtime injects them).
#
# BRING YOUR OWN database to monitor. BetterDB Monitor is a monitoring tool: it
# points at the Valkey/Redis you ALREADY run, so this file does NOT provision a
# throwaway Valkey. Connect the database you want to monitor either by:
#   a) adding it in the app UI after deploy (Settings > Connections) — supports
#      a per-connection TLS toggle; or
#   b) uncommenting the DB_* block below and pointing it at your existing Aiven
#      Valkey/Redis service (set DB_TLS=true — Aiven managed services need TLS).
#
# Suggested Runtime sizing:
#   - App: 1 replica, ~1 GiB RAM, public HTTP port 3001.
#   - PostgreSQL (audit storage): version 16, defaultdb.
#
# AI features (Ollama-backed) are intentionally OFF here: this builds the
# `production-no-ai` image target, so no 8 GiB model service is required.

services:
  betterdb-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-no-ai
      # args:
      #   APP_VERSION: "0.44.0"
    ports:
      - "3001:3001"
    depends_on:
      - betterdb-postgres
    environment:
      NODE_ENV: production
      PORT: "3001"

      # --- Database to MONITOR (bring your own) ---
      # Leave commented to add the connection in the app UI after deploy, or
      # uncomment and point at your existing Aiven Valkey/Redis service.
      # DB_TYPE: valkey
      # DB_HOST: your-valkey.aivencloud.com
      # DB_PORT: "12345"
      # DB_USERNAME: default
      # DB_PASSWORD: CHANGE_ME     # set as a secret in Runtime
      # DB_TLS: "true"            # Aiven managed Valkey/Redis requires TLS

      # --- Audit storage (the managed Aiven PostgreSQL below) ---
      STORAGE_TYPE: postgres
      # Aiven managed PostgreSQL requires SSL — keep sslmode=require.
      STORAGE_URL: postgresql://USER:PASSWORD@betterdb-postgres:5432/defaultdb?sslmode=require

      # --- App auth / misc ---
      AUTH_SECRET: CHANGE_ME       # set as a secret in Runtime
      AUTH_PUBLIC_URL: https://your-app.aiven.run   # set to the Runtime app URL
      AI_ENABLED: "false"

  # Managed service: Runtime auto-detects this image and provisions the real
  # Aiven PostgreSQL. Do not add credentials here.
  betterdb-postgres:
    image: postgres:16
