[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betterdb-hermes-memory"
version = "0.1.0"
description = "Hermes memory provider backed by betterdb-agent-memory on Valkey / valkey-search: semantic long-term recall with recency and importance ranking."
readme = "README.md"
license = { text = "MIT" }
keywords = ["hermes", "hermes-agent", "memory", "valkey", "vector-search", "llm"]
# Matches Hermes's own range (">=3.11,<3.15"). betterdb-agent-memory declares
# ">=3.11" (no ceiling) so it resolves cleanly across this whole range.
requires-python = ">=3.11,<3.15"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "betterdb-agent-memory>=0.7.0,<0.8.0",
    "valkey>=6.0,<7.0",
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/BetterDB-inc/monitor/tree/master/packages/hermes-memory-py"
Repository = "https://github.com/BetterDB-inc/monitor"
Issues = "https://github.com/BetterDB-inc/monitor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.entry-points."hermes_agent.memory_providers"]
betterdb = "betterdb_hermes_memory:register"

[tool.hatch.build.targets.wheel]
packages = ["betterdb_hermes_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
