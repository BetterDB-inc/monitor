# kind cluster for scripts/openeverest-e2e.sh: OpenEverest 2.0.0-alpha.1 needs
# Kubernetes >= 1.32, and provider-valkey spreads an instance's nodes across
# Kubernetes nodes, so a 3-shard cluster wants three workers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
