name: API Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: false
        type: string
        default: 'main'
  pull_request:
    branches:
      - master
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'proprietary/**'
      - 'pnpm-lock.yaml'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: proprietary/entitlement
        run: pnpm prisma:generate

      - name: Build workspace packages
        run: pnpm build --filter @betterdb/agent-memory...

      - name: Run API tests
        working-directory: apps/api
        run: pnpm test

      - name: Run entitlement unit tests
        working-directory: proprietary/entitlement
        run: pnpm vitest run --exclude 'src/**/integration/**'

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Valkey Logs ==="
          docker logs betterdb-test-valkey 2>&1 | tail -50 || echo "Container not found"
          echo "=== Redis Logs ==="
          docker logs betterdb-test-redis 2>&1 | tail -50 || echo "Container not found"
          echo "=== PostgreSQL Logs ==="
          docker logs betterdb-test-postgres 2>&1 | tail -50 || echo "Container not found"

  ai-facade-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build @betterdb/ai and its dependencies
        run: pnpm build --filter @betterdb/ai...

      - name: Run @betterdb/ai export completeness guard
        run: pnpm --filter @betterdb/ai test

  ai-py-facade-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the five children and the facade
        run: |
          pip install \
            -e packages/valkey-search-kit-py \
            -e packages/agent-cache-py \
            -e packages/semantic-cache-py \
            -e packages/retrieval-py \
            -e packages/agent-memory-py \
            -e "packages/ai-py[dev]" \
            httpx

      - name: Run betterdb-ai export completeness guard
        working-directory: packages/ai-py
        run: pytest tests/ -q

      - name: Run betterdb-semantic-cache tests
        working-directory: packages/semantic-cache-py
        run: pytest tests/ -q
