# Publishes charts/betterdb-monitor as a public Helm repo hosted on GitHub Pages:
#   - chart tarball  -> docs/charts/betterdb-monitor-<version>.tgz
#   - PGP provenance -> docs/charts/betterdb-monitor-<version>.tgz.prov (signed)
#   - repo index     -> docs/charts/index.yaml
# both served at https://docs.betterdb.com/charts (Pages already serves the
# Jekyll site from docs/ on master, so the tarball + index sit alongside it and
# index.yaml's urls: point back at the same host).
#
# This uses plain `helm package` + `helm repo index` rather than chart-releaser:
# `cr index` unconditionally checks out a worktree of the `gh-pages` branch to
# load the existing index (fatal: invalid reference: origin/gh-pages), which
# does not exist in this docs/-on-master model. helm's own tooling has no such
# dependency. Only betterdb-monitor is published; charts/valkey-search is
# internal and deliberately excluded.
#
# When it runs: docker-publish.yml calls this workflow on every v* tag, after
# both images (betterdb/monitor:<v> and :<v>-no-ai) are pushed, so the chart
# never becomes visible before the image it defaults to. The chart is released
# in lockstep with the app (chart version == appVersion == app version, set by
# scripts/bump-version.mjs), so there is no publish on master pushes: a chart
# change ships with the next app release. Run it by hand (workflow_dispatch)
# with a release tag to re-publish, e.g. after a failed run. Manual runs only
# take a v* tag: packaging a branch would publish whatever chart is on it under
# the release version, and the already-published guard would make that permanent.
#
# The chart is packaged from the release ref, but the tarballs and index.yaml
# are rebuilt over master's docs/charts, so a release cut from an older commit
# never drops versions published since. A version that is already published
# (its .tgz exists in docs/charts on master) is a no-op.
#
# After the classic publish, the `oci` job pushes the same chart version to
# oci://ghcr.io/betterdb/charts through helm-publish-oci.yml, which is also
# what publishes charts/betterdb-openeverest (on its own tags).
name: Publish Helm Chart

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (the release tag) to package the chart from'
        required: true
        type: string
      version:
        description: 'Release version the chart must match, e.g. 0.56.0'
        required: true
        type: string
    secrets:
      HELM_PUBLISH_TOKEN:
        required: false
      HELM_GPG_PRIVATE_KEY:
        required: false
      HELM_GPG_PASSPHRASE:
        required: false
      HELM_GPG_KEY:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to package the chart from (e.g. v0.57.0)'
        required: true
        type: string

# The commit to master is made with HELM_PUBLISH_TOKEN, not GITHUB_TOKEN;
# packages: write is for the OCI push only (see the `oci` job).
permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # queue: max keeps every pending publish (by default a newer pending run
    # replaces an older one, which would skip that release's chart).
    concurrency:
      group: helm-publish
      cancel-in-progress: false
      queue: max
    env:
      SOURCE_REF: ${{ inputs.ref }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      # Both callers pass a release tag; refuse anything else (a branch, a SHA)
      # and check out refs/tags/<tag> so a same-named branch cannot shadow it.
      - name: Resolve release tag
        id: tag
        run: |
          tag="${SOURCE_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "::error::ref must be a release tag like v0.57.0 (got '${SOURCE_REF}')."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout chart source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # Only docs/charts is needed from master: the published tarballs the
      # index is rebuilt over, and the HEAD the commit below is pinned to.
      - name: Checkout published charts (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: pages
          sparse-checkout: docs/charts
          persist-credentials: false

      # Fail before anything is published if the publish token is missing or
      # the chart has drifted from the app or from the release tag.
      # scripts/check-chart-version.sh is the same check chart-tests.yml runs
      # on every PR; here it also pins the version to the tag being released.
      - name: Preflight (token present, versions in sync)
        id: preflight
        env:
          HELM_PUBLISH_TOKEN: ${{ secrets.HELM_PUBLISH_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$HELM_PUBLISH_TOKEN" ]; then
            echo "::error::HELM_PUBLISH_TOKEN is not set — required to commit the chart + index to protected master (a fine-grained PAT with contents:write from a user who bypasses branch protection). Set the secret and rerun."
            exit 1
          fi
          # A manual run has no version input; the tag pins it instead.
          expected="${RELEASE_VERSION:-$TAG}"
          scripts/check-chart-version.sh "$expected"
          version=$(grep '^version:' charts/betterdb-monitor/Chart.yaml | sed 's/.*: *//; s/"//g')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The chart's default image is <appVersion>-no-ai. A chart published
      # before its image exists would leave `helm install` in ImagePullBackOff,
      # so check both variants first. On a tag this job already runs after the
      # image jobs; the check also guards a manual run.
      - name: Check both images exist on Docker Hub
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          for image in "betterdb/monitor:${VERSION}-no-ai" "betterdb/monitor:${VERSION}"; do
            if ! docker manifest inspect "$image" > /dev/null; then
              echo "::error::${image} is not on Docker Hub. Publish the images first (docker-publish.yml on tag v${VERSION}), then rerun."
              exit 1
            fi
            echo "${image} exists"
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/betterdb-monitor

      # Package into master's docs/charts (which the second checkout populated
      # with every previously-published .tgz) and rebuild index.yaml over the
      # whole dir, so the index carries all versions. Skips entirely when this
      # version's tarball already exists — that is the "already published" no-op.
      - name: Package chart and rebuild index
        id: pkg
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
          HELM_GPG_PRIVATE_KEY: ${{ secrets.HELM_GPG_PRIVATE_KEY }}
          HELM_GPG_PASSPHRASE: ${{ secrets.HELM_GPG_PASSPHRASE }}
          HELM_GPG_KEY: ${{ secrets.HELM_GPG_KEY }}
        run: |
          tgz="betterdb-monitor-${VERSION}.tgz"
          out=pages/docs/charts
          mkdir -p "$out"
          if [ -f "${out}/${tgz}" ]; then
            echo "Chart version ${VERSION} already published (docs/charts/${tgz} exists on master) — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Import the signing key into a throwaway keyring and export the legacy
          # secring.gpg that Helm reads directly (Helm does not use gpg-agent).
          export GNUPGHOME="$(mktemp -d)"
          echo "$HELM_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "$HELM_GPG_PASSPHRASE" \
            --export-secret-keys > "$GNUPGHOME/secring.gpg"
          printf '%s' "$HELM_GPG_PASSPHRASE" > "$GNUPGHOME/pp"
          # --sign writes betterdb-monitor-<version>.tgz.prov next to the tarball.
          helm package charts/betterdb-monitor -d "$out" \
            --sign --key "$HELM_GPG_KEY" \
            --keyring "$GNUPGHOME/secring.gpg" \
            --passphrase-file "$GNUPGHOME/pp"
          rm -rf "$GNUPGHOME"
          test -f "${out}/${tgz}.prov"   # fail loudly if no provenance was produced
          helm repo index "$out" --url https://docs.betterdb.com/charts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tgz=${tgz}" >> "$GITHUB_OUTPUT"
          echo "head_oid=$(git -C pages rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commit the new tarball + index via the GraphQL createCommitOnBranch API
      # rather than `git push`, for two reasons dictated by master's protection:
      #   1. Signed commits are required. Commits created via this mutation are
      #      automatically GPG-signed by GitHub (verified); a plain git commit
      #      from the runner would be rejected as unsigned.
      #   2. A PR review is required, and GitHub refuses to add the built-in
      #      Actions integration to any bypass list on this org. So the commit
      #      uses HELM_PUBLISH_TOKEN — a fine-grained PAT from a user who
      #      bypasses the review rule. (The preflight guarantees it is set.)
      # expectedHeadOid pins the commit to the master HEAD whose docs/charts the
      # index was rebuilt from; if any push lands on master in the window the
      # mutation fails safely and a rerun re-publishes (idempotent — the guard
      # above skips an already-shipped .tgz).
      - name: Commit chart + index to master (signed, via API)
        if: steps.pkg.outputs.changed == 'true'
        working-directory: pages
        env:
          GH_TOKEN: ${{ secrets.HELM_PUBLISH_TOKEN }}
          HEAD_OID: ${{ steps.pkg.outputs.head_oid }}
          VERSION: ${{ steps.pkg.outputs.version }}
          TGZ: ${{ steps.pkg.outputs.tgz }}
        run: |
          tgz_path="docs/charts/${TGZ}"
          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg oid "$HEAD_OID" \
            --arg version "$VERSION" \
            --arg idx "$(base64 -w0 docs/charts/index.yaml)" \
            --arg tgzpath "$tgz_path" \
            --arg tgzdata "$(base64 -w0 "$tgz_path")" \
            --arg provpath "${tgz_path}.prov" \
            --arg provdata "$(base64 -w0 "${tgz_path}.prov")" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "master"},
                expectedHeadOid: $oid,
                message: {headline: ("chore(helm): publish betterdb-monitor " + $version + " [skip ci]")},
                fileChanges: {additions: [
                  {path: "docs/charts/index.yaml", contents: $idx},
                  {path: $tgzpath, contents: $tgzdata},
                  {path: $provpath, contents: $provdata}
                ]}
              }}
            }' > "$RUNNER_TEMP/commit-payload.json"
          gh api graphql --input "$RUNNER_TEMP/commit-payload.json"
          echo "Published betterdb-monitor ${VERSION}"

  # Same version, second channel: the OpenEverest hub and `helm install
  # oci://...` users read the chart from ghcr. Runs after the classic publish so
  # the two never disagree on what the latest version is; a version already in
  # the registry is a no-op there too.
  oci:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-publish-oci.yml
    with:
      chart: betterdb-monitor
      ref: refs/tags/${{ needs.release.outputs.tag }}
