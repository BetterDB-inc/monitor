# Publish betterdb-hermes-memory to PyPI
#
# Uses PyPI Trusted Publisher (OIDC) — no API token required.
# Trusted publisher is registered at pypi.org/manage/account/publishing/
#
# Trigger by pushing a tag: hermes-memory-py-v0.1.0
#
# Publish betterdb-agent-memory BEFORE this: the built wheel carries an
# unqualified `Requires-Dist` on it, resolved from PyPI at install time.
#
# The build runs in a job with read-only permissions and uploads the artifacts.
# Only the separate publish job holds `id-token: write`, and it runs no project
# build code — so a build hook can never reach the PyPI publishing identity.
# Third-party actions are pinned to immutable commit SHAs.

name: Publish Hermes Memory (Python)

on:
  push:
    tags:
      - 'hermes-memory-py-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true
        type: string
      skip_pypi:
        description: 'Skip PyPI publish (dry run)'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: packages/hermes-memory-py
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: packages/hermes-memory-py
        run: pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    # Read-only: project build code (pip, build hooks) runs here, with no access
    # to the publishing identity.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build hatchling

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            # hermes-memory-py-v0.1.0 → 0.1.0
            echo "version=${GITHUB_REF_NAME#hermes-memory-py-v}" >> $GITHUB_OUTPUT
          fi

      - name: Update pyproject.toml version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: packages/hermes-memory-py
        run: |
          python - <<'EOF'
          import re, os, pathlib
          path = pathlib.Path("pyproject.toml")
          content = path.read_text()
          content = re.sub(
              r'^version\s*=\s*"[^"]+"',
              f'version = "{os.environ["VERSION"]}"',
              content,
              flags=re.MULTILINE,
          )
          path.write_text(content)
          EOF

      - name: Verify betterdb dependencies are on PyPI
        working-directory: packages/hermes-memory-py
        run: |
          # The built wheel ships an unqualified Requires-Dist on
          # betterdb-agent-memory. Publish that to PyPI first, or a published
          # betterdb-hermes-memory is uninstallable via pip. Fail before publishing.
          SPECS=$(python - <<'EOF'
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          for dep in data.get("project", {}).get("dependencies", []):
              if dep.replace(" ", "").startswith("betterdb-agent-memory"):
                  print(dep)
          EOF
          )
          if [ -z "$SPECS" ]; then
            echo "Could not find betterdb-agent-memory dependency in pyproject.toml"
            exit 1
          fi
          while IFS= read -r SPEC; do
            [ -z "$SPEC" ] && continue
            echo "Resolving '$SPEC' from PyPI..."
            pip install "$SPEC" --dry-run --quiet
            echo "Dependency '$SPEC' is resolvable on PyPI"
          done <<< "$SPECS"

      - name: Build wheel and sdist
        working-directory: packages/hermes-memory-py
        run: python -m build

      - name: Verify build artifacts
        working-directory: packages/hermes-memory-py
        run: |
          ls dist/
          test -n "$(ls dist/*.whl 2>/dev/null)"
          test -n "$(ls dist/*.tar.gz 2>/dev/null)"

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: packages/hermes-memory-py/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # skip_pypi is only populated on workflow_dispatch; on tag push it is null/falsy,
    # so !inputs.skip_pypi is always true for tag events (publish always runs).
    # Dry-run is only available via manual workflow_dispatch with skip_pypi=true.
    if: ${{ !inputs.skip_pypi }}
    environment: pypi
    # The only job with id-token: write. It runs no project build code — just the
    # trusted, SHA-pinned download / publish / release actions.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: packages/hermes-memory-py/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/hermes-memory-py/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: hermes-memory-py-v${{ needs.build.outputs.version }}
          name: Hermes Memory Python v${{ needs.build.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          body_path: packages/hermes-memory-py/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify PyPI package (with retry)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            if pip install "betterdb-hermes-memory==$VERSION" --dry-run --quiet 2>/dev/null; then
              echo "Package betterdb-hermes-memory==$VERSION verified"
              exit 0
            fi
            echo "Attempt $i: not yet available, retrying in 30s…"
            sleep 30
          done
          echo "Package not available after 5 attempts"
          exit 1
