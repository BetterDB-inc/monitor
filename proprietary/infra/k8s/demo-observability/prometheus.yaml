# Prometheus for the public demo. Cluster-internal only (no Ingress); Grafana
# is the public face. Receives the demo tenant's metrics twice:
#   - job "betterdb-scrape": direct scrape of /api/prometheus/metrics (bearer token)
#   - OTLP push: the tenant's built-in mirror posts to the native OTLP
#     receiver (/api/v1/otlp/v1/metrics); series arrive under the job derived
#     from the pushed service.name resource attribute.
# REPLACE tenant-DEMO_SUBDOMAIN with the real demo tenant namespace (see README).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: demo-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    otlp:
      # Keep enough resource identity for dashboards to tell the OTLP-pushed
      # copy apart from the scraped one.
      promote_resource_attributes:
        - service.name
        - service.instance.id

    storage:
      tsdb:
        # OTLP is push-based: a retried/delayed export can land after a newer
        # one. Without this window those late samples are rejected as
        # out-of-order and the OTLP-path series show silent gaps.
        out_of_order_time_window: 30m

    scrape_configs:
      # The demo tenant's own exposition endpoint, authenticated with the
      # PRIMARY metrics token (the published public token is for visitors;
      # rotating it must not break this scrape).
      # The pull/scrape path. Distinct job name from the OTLP-push series
      # (which arrive as job="betterdb-monitor", from the app's OTLP
      # service.name) so the two ingestion paths are unambiguous.
      - job_name: 'betterdb-scrape'
        metrics_path: '/api/prometheus/metrics'
        # The tenant's /metrics can take ~15s when it polls unreachable
        # monitored databases, so give the scrape generous headroom over the
        # 10s default (timeout must be <= interval).
        scrape_interval: 60s
        scrape_timeout: 45s
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus-secrets/scrape-token/token
        static_configs:
          - targets: ['betterdb.tenant-DEMO_SUBDOMAIN.svc.cluster.local:80']
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: demo-observability
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp2
  resources:
    requests:
      # 24h retention of one tenant's series (scraped + OTLP copy) writes on
      # the order of tens of MB/day; 2Gi is already generous headroom.
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: demo-observability
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate # single PVC, RWO
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Demo data is disposable; keep the footprint small.
            - --storage.tsdb.retention.time=24h
            # Accept the demo tenant's OTLP metrics mirror on
            # /api/v1/otlp/v1/metrics.
            - --web.enable-otlp-receiver
            # Anonymous Grafana viewers can run ad-hoc PromQL through
            # /api/ds/query, so bound what a single query can cost.
            - --query.timeout=30s
            - --query.max-samples=5000000
            - --query.max-concurrency=4
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
            # Sibling of /etc/prometheus, NOT nested inside it: configMap
            # volumes mount read-only, so the runtime cannot create a nested
            # mountpoint under them (pod would fail with CreateContainerError,
            # 'read-only file system').
            - name: scrape-token
              mountPath: /etc/prometheus-secrets/scrape-token
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
        - name: scrape-token
          secret:
            secretName: demo-scrape-token
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: demo-observability
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
