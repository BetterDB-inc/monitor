{{- if .Values.metrics.grafanaDashboards.enabled }}
{{- /*
One ConfigMap per dashboard keeps each well under the 1 MiB ConfigMap limit.
dashboards/*.json are byte-identical copies of deploy/observability/dashboards
(scripts/sync-chart-observability.mjs). .Files.Get returns them as data, so
Grafana's own legend templates are not evaluated by Helm.

Names must stay within 63 characters and be unique per release. A fullname of
up to 34 characters is used as is (the longest suffix, -dashboard-
monitor-internals, adds 28). A longer one is cut to 27 characters and followed
by 6 characters of its sha256, so two releases sharing a long prefix in one
namespace still get distinct ConfigMaps.
*/}}
{{- $fullname := include "betterdb-monitor.fullname" . }}
{{- $prefix := $fullname }}
{{- if gt (len $fullname) 34 }}
{{- $prefix = printf "%s-%s" ($fullname | trunc 27 | trimSuffix "-") ($fullname | sha256sum | trunc 6) }}
{{- end }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $dashboard := base $path | trimSuffix ".json" | trimPrefix "betterdb-" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dashboard-%s" $prefix $dashboard }}
  namespace: {{ $.Values.metrics.grafanaDashboards.namespace | default $.Release.Namespace }}
  labels:
    {{- include "betterdb-monitor.labels" $ | nindent 4 }}
    {{- with $.Values.metrics.grafanaDashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $.Values.metrics.grafanaDashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
