{{- if .Values.metrics.grafanaDashboards.enabled }}
{{- /*
One ConfigMap per dashboard keeps each well under the 1 MiB ConfigMap limit.
dashboards/*.json are byte-identical copies of deploy/observability/dashboards
(scripts/sync-chart-observability.mjs). .Files.Get returns them as data, so
Grafana's own legend templates are not evaluated by Helm. The fullname is cut
to 30 characters so the longest dashboard suffix still fits in 63 and two
dashboards can never truncate to the same name.
*/}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $dashboard := base $path | trimSuffix ".json" | trimPrefix "betterdb-" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dashboard-%s" (include "betterdb-monitor.fullname" $ | trunc 30 | trimSuffix "-") $dashboard }}
  namespace: {{ $.Values.metrics.grafanaDashboards.namespace | default $.Release.Namespace }}
  labels:
    {{- include "betterdb-monitor.labels" $ | nindent 4 }}
    {{- with $.Values.metrics.grafanaDashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $.Values.metrics.grafanaDashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
