# Prometheus alerting rules for BetterDB Monitor. Load with `rule_files:` in
# prometheus.yml, or install them as a PrometheusRule with the Helm chart
# (metrics.prometheusRule.enabled=true).
#
# Every alert carries the monitored instance in its `connection` label. Rules
# that aggregate keep `namespace`, `job` and `connection`, so one monitor
# watching many instances raises one alert per instance, two releases watching
# the same instance stay apart, and namespaced AlertmanagerConfigs still match.
# (Outside Kubernetes `namespace` is simply absent, which is harmless.)
#
# The anomaly and correlated-group counters are created on their first
# increment, so a new label set first appears already at 1 and increase()
# alone reports 0 for it. The `(m unless m offset W) or increase(m[W])` form
# counts a series that was absent W ago at its current value, so the first
# event after a monitor restart (or the first of its kind) still alerts.
#
# The chart ships a byte-identical copy at
# charts/betterdb-monitor/files/alert-rules.yaml. Edit this file, then run
# `node scripts/sync-chart-observability.mjs` to refresh the copy.
groups:
  - name: betterdb-anomaly-alerts
    rules:
      # Critical anomaly detected
      - alert: BetterDBCriticalAnomaly
        expr: sum by (namespace, job, connection, metric_type) ((betterdb_anomaly_events_total{severity="critical"} unless betterdb_anomaly_events_total{severity="critical"} offset 5m) or increase(betterdb_anomaly_events_total{severity="critical"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Critical anomaly detected on {{ $labels.connection }}"
          description: "BetterDB detected a critical anomaly for metric {{ $labels.metric_type }}. Check the Anomaly Dashboard for details."

      # Multiple warnings in short period
      - alert: BetterDBWarningSpike
        expr: sum by (namespace, job, connection) ((betterdb_anomaly_events_total{severity="warning"} unless betterdb_anomaly_events_total{severity="warning"} offset 5m) or increase(betterdb_anomaly_events_total{severity="warning"}[5m])) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Multiple warning anomalies on {{ $labels.connection }}"
          description: "{{ $value }} warning-level anomalies detected in the last 5 minutes."

      # Memory pressure pattern
      - alert: BetterDBMemoryPressure
        expr: sum by (namespace, job, connection) ((betterdb_correlated_groups_total{pattern="memory_pressure"} unless betterdb_correlated_groups_total{pattern="memory_pressure"} offset 10m) or increase(betterdb_correlated_groups_total{pattern="memory_pressure"}[10m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Memory pressure detected on {{ $labels.connection }}"
          description: "BetterDB detected memory pressure pattern. Memory usage and evictions are elevated."

      # Auth attack pattern
      - alert: BetterDBAuthAnomaly
        expr: sum by (namespace, job, connection) ((betterdb_correlated_groups_total{pattern="auth_attack"} unless betterdb_correlated_groups_total{pattern="auth_attack"} offset 5m) or increase(betterdb_correlated_groups_total{pattern="auth_attack"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Authentication anomaly on {{ $labels.connection }}"
          description: "Multiple ACL denied events detected. Possible brute force attempt or misconfigured client."

      # Connection leak pattern
      - alert: BetterDBConnectionLeak
        expr: sum by (namespace, job, connection) ((betterdb_correlated_groups_total{pattern="connection_leak"} unless betterdb_correlated_groups_total{pattern="connection_leak"} offset 10m) or increase(betterdb_correlated_groups_total{pattern="connection_leak"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Possible connection leak on {{ $labels.connection }}"
          description: "Connections increasing without proportional command activity."

      # Detection system not ready
      - alert: BetterDBAnomalyDetectionWarming
        expr: min by (namespace, job, connection) (betterdb_anomaly_buffer_ready) < 1
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Anomaly detection warming up on {{ $labels.connection }}"
          description: "Some metric buffers are still collecting baseline data. Detection accuracy may be reduced."

      # High number of unresolved critical anomalies
      - alert: BetterDBUnresolvedCriticalAnomalies
        expr: betterdb_anomaly_events_current{severity="critical"} > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Multiple unresolved critical anomalies on {{ $labels.connection }}"
          description: "{{ $value }} critical anomalies remain unresolved. Review and resolve to prevent alert fatigue."

      # Traffic burst pattern
      - alert: BetterDBTrafficBurst
        expr: sum by (namespace, job, connection) ((betterdb_correlated_groups_total{pattern="traffic_burst"} unless betterdb_correlated_groups_total{pattern="traffic_burst"} offset 5m) or increase(betterdb_correlated_groups_total{pattern="traffic_burst"}[5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Traffic burst detected on {{ $labels.connection }}"
          description: "Unusual spike in operations or network traffic detected."

      # Persistent anomalies
      - alert: BetterDBPersistentAnomalies
        expr: betterdb_anomaly_by_severity{severity!="info"} > 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Persistent anomalies on {{ $labels.connection }}"
          description: "{{ $value }} anomalies detected in the last hour. System may be unstable."

      # Level alert: fires while unpatched (webhooks are fire-on-change)
      - alert: CveKevPresent
        expr: betterdb_cve_kev > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "KEV-exploited CVEs on {{ $labels.connection }}"
          description: "{{ $value }} known-exploited CVEs in the latest scan. Patch immediately."

      # Level alert: fires while unpatched (webhooks are fire-on-change)
      - alert: CveCriticalPresent
        expr: betterdb_cve_findings{severity="critical"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Critical CVEs on {{ $labels.connection }}"
          description: "{{ $value }} critical CVEs in the latest scan. Review Security page."

      # Webhooks are degraded when the dataset is stale
      - alert: CveDatasetStale
        expr: betterdb_cve_dataset_stale > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "CVE dataset stale on {{ $labels.connection }}"
          description: "CVE scan is partial or missing sources; counts are a floor and new findings may be delayed. Check data sources and unreachable nodes."

      # Level alert: under the default stop-writes-on-bgsave-error yes, every
      # write is refused with MISCONF until a BGSAVE succeeds again
      - alert: BetterDBPersistenceFailing
        expr: betterdb_rdb_last_bgsave_ok == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "BGSAVE failing on {{ $labels.connection }} (writes are refused only if stop-writes-on-bgsave-error=yes)"
          description: "Last BGSAVE failed. Writes are rejected with MISCONF only when stop-writes-on-bgsave-error is yes (the default) and save points are configured. Check disk space, permissions and fork memory."

      # Edge alert: maxclients reached — new clients get "ERR max number of
      # clients reached" until connections are released
      - alert: BetterDBConnectionsRejected
        expr: increase(betterdb_rejected_connections_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Connections rejected on {{ $labels.connection }} (maxclients reached)"
          description: "{{ $value }} client connections were refused in the last 5 minutes because maxclients was reached. Raise maxclients or find the client that is leaking connections."

      # Replicas keep needing full syncs instead of partial ones — usually a
      # replication backlog that is too small or replicas dropped for output
      # buffer overflow
      - alert: BetterDBRepeatedFullResyncs
        expr: increase(betterdb_sync_full_total[15m]) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Repeated full resyncs served by {{ $labels.connection }}"
          description: "{{ $value }} full resynchronizations in the last 15 minutes. Each one forks and transfers the whole dataset. Check repl-backlog-size, client-output-buffer-limit replica and replica network stability."

      # Growth rule (requires Pro key analytics): fires on a tracked key that
      # grew by more than 100 MiB over the last hour. Tune the threshold to
      # your workload; see docs/prometheus-metrics.md for the static variant.
      - alert: BetterDBKeyMemoryGrowth
        expr: delta(max_over_time(betterdb_key_memory_bytes[15m])[1h:5m]) > 104857600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Key {{ $labels.key }} on {{ $labels.connection }} is growing fast"
          description: "Tracked key {{ $labels.key }} (db {{ $labels.db }}, {{ $labels.type }}) grew by {{ $value | humanize1024 }}B over the last hour."

  # Built only on the series exported under both METRICS_EXPORT_PROFILE values
  # (vitals and full), so they work on every deployment.
  - name: betterdb-availability-alerts
    rules:
      # The monitor has had no successful INFO poll within the staleness bound
      # (PROMETHEUS_STALENESS_MS). The instance's gauges are dropped from the
      # exposition at that point, so this series is what still says so.
      - alert: BetterDBConnectionStale
        expr: betterdb_poll_stale == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BetterDB cannot reach {{ $labels.connection }}"
          description: "No successful INFO poll of {{ $labels.connection }} within the staleness bound. The instance is down, unreachable from the monitor, or rejecting its credentials."

      # Close to maxmemory: evictions (or OOM errors under noeviction) follow.
      # Instances without a maxmemory limit (0) are excluded.
      - alert: BetterDBMemoryNearLimit
        expr: betterdb_memory_used_bytes / (betterdb_memory_max_bytes > 0) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory above 90% of maxmemory on {{ $labels.connection }}"
          description: "Used memory is {{ $value | humanizePercentage }} of maxmemory. Expect evictions, or write errors under maxmemory-policy noeviction."

      # A replica lost its link to its primary and is serving stale data.
      - alert: BetterDBReplicaLinkDown
        expr: betterdb_master_link_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Replica {{ $labels.connection }} lost its link to the primary"
          description: "master_link_status is down: the replica is not receiving writes and serves stale reads until it resyncs."

      # Slots in FAIL state are unserved: commands for keys in them error.
      - alert: BetterDBClusterSlotsFailing
        expr: betterdb_cluster_slots_fail > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cluster slots failing as seen from {{ $labels.connection }}"
          description: "{{ $value }} hash slots are in FAIL state. Commands for keys in those slots are rejected until the cluster recovers or fails over."
