{{- $caFile := include "betterdb-openeverest.caFile" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "betterdb-openeverest.fullname" . }}
  labels:
    {{- include "betterdb-openeverest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # One pod at a time: two would both dial the same nodes (see replicaCount).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "betterdb-openeverest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "betterdb-openeverest.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "betterdb-openeverest.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: plugin
          image: {{ include "betterdb-openeverest.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: BETTERDB_AGENT_MODE
              value: openeverest
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: PLUGIN_NAME
              value: {{ .Values.plugin.name | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.openeverest.apiUrl }}
            - name: EVEREST_API_URL
              value: {{ . | quote }}
            {{- end }}
            - name: OPENEVEREST_CLUSTER_NAME
              value: {{ .Values.openeverest.clusterName | quote }}
            - name: BETTERDB_SETTINGS_SECRET
              value: {{ include "betterdb-openeverest.settingsSecretName" . | quote }}
            - name: BETTERDB_TARGETS_CONFIGMAP
              value: {{ include "betterdb-openeverest.targetsConfigMapName" . | quote }}
            - name: BETTERDB_FINGERPRINT_SECRET
              value: {{ include "betterdb-openeverest.fingerprintSecretName" . | quote }}
            {{- with .Values.watchNamespaces }}
            - name: WATCH_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if $caFile }}
            - name: BETTERDB_CA_FILE
              value: {{ $caFile | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          # /readyz turns 200 once the backend watches instances; /healthz only
          # says the process is up, so a slow start is not a restart loop.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (include "betterdb-openeverest.mountCa" .) .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if include "betterdb-openeverest.mountCa" . }}
            - name: betterdb-ca
              mountPath: /etc/betterdb/ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (include "betterdb-openeverest.mountCa" .) .Values.extraVolumes }}
      volumes:
        {{- if include "betterdb-openeverest.mountCa" . }}
        - name: betterdb-ca
          secret:
            secretName: {{ include "betterdb-openeverest.caSecretName" . }}
            items:
              - key: {{ include "betterdb-openeverest.caSecretKey" . }}
                path: ca.crt
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
