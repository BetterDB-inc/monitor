{{- if include "betterdb-openeverest.createSettingsSecret" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "betterdb-openeverest.settingsSecretName" . }}
  labels:
    {{- include "betterdb-openeverest.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.betterdb.url }}
  url: {{ . | quote }}
  {{- end }}
  {{- with .Values.betterdb.token }}
  token: {{ . | quote }}
  {{- end }}
  {{- with .Values.betterdb.ca }}
  ca.crt: |
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
