{{- if include "betterdb-openeverest.createSettingsSecret" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "betterdb-openeverest.settingsSecretName" . }}
  labels:
    {{- include "betterdb-openeverest.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.betterdb.url }}
  url: {{ . | quote }}
  {{- end }}
  {{- with .Values.betterdb.token }}
  token: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.betterdb.ca .Values.betterdb.existingCaSecret.name }}
{{- fail "set either betterdb.ca or betterdb.existingCaSecret.name, not both" }}
{{- end }}
{{- with .Values.betterdb.ca }}
---
# The CA bundle for the BetterDB WebSocket, on its own so it also works with
# betterdb.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "betterdb-openeverest.caSecretName" $ }}
  labels:
    {{- include "betterdb-openeverest.labels" $ | nindent 4 }}
type: Opaque
stringData:
  ca.crt: |
    {{- . | nindent 4 }}
{{- end }}
