{{- if not .Values.betterdb.existingFingerprintSecret -}}
{{- $name := include "betterdb-openeverest.fingerprintSecretName" . -}}
{{- /*
The random key node agents tag redacted secrets with. It is rendered here
rather than created by the backend, so the ServiceAccount needs no `create` on
secrets: with that and its secret read it could mint a token for any
ServiceAccount in this namespace. An existing key is kept on upgrade (lookup)
and on uninstall (resource-policy), since a new key changes every tag at once.
Without cluster access (helm template, most GitOps tools) lookup finds
nothing and every render makes a new key, so set
betterdb.existingFingerprintSecret there.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := "" -}}
{{- if $existing -}}
{{- $key = index ($existing.data | default dict) "key" | default "" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "betterdb-openeverest.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ $key | default (randBytes 32) | quote }}
{{- end }}
