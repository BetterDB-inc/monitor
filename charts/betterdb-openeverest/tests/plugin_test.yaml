suite: plugin and secret
templates:
  - templates/plugin.yaml
  - templates/secret.yaml
tests:
  - it: declares a cluster-scoped Plugin named independently of the release, pointing at the Service
    template: templates/plugin.yaml
    release:
      namespace: everest-system
    asserts:
      - isKind:
          of: Plugin
      - isAPIVersion:
          of: extensions.openeverest.io/v1alpha1
      - equal:
          path: metadata.name
          value: betterdb
      - equal:
          path: spec.backend.serviceRef
          value:
            namespace: everest-system
            name: RELEASE-NAME-betterdb-openeverest
            port: 8080
      - equal:
          path: spec.frontend.bundlePath
          value: /main.js
      - notExists:
          path: spec.compatibleHostVersions

  - it: registers the BetterDB tab for valkey only, plus the settings panel
    template: templates/plugin.yaml
    asserts:
      - equal:
          path: spec.frontend.extensionPoints[0]
          value:
            type: clusterDetailTab
            path: betterdb
            label: BetterDB
            providers: [valkey]
      - equal:
          path: spec.frontend.extensionPoints[1].type
          value: settingsPanel
      - contains:
          path: spec.permissions
          content:
            verb: read-connection
            resource: database-clusters

  - it: pins the host range when asked
    template: templates/plugin.yaml
    set:
      plugin.compatibleHostVersions: ">=2.0.0-alpha.1 <3.0.0"
    asserts:
      - equal:
          path: spec.compatibleHostVersions
          value: ">=2.0.0-alpha.1 <3.0.0"

  - it: renders no settings Secret by default
    template: templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the settings Secret from inline values
    template: templates/secret.yaml
    set:
      betterdb.url: wss://acme.app.betterdb.com/agent/ws
      betterdb.token: tok
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-betterdb-openeverest-settings
      - equal:
          path: stringData.url
          value: wss://acme.app.betterdb.com/agent/ws
      - equal:
          path: stringData.token
          value: tok

  - it: renders nothing when an existing Secret is used, even with inline values
    template: templates/secret.yaml
    set:
      betterdb.existingSecret: mine
      betterdb.url: wss://x/agent/ws
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the CA in its own Secret, also alongside an existing settings Secret
    template: templates/secret.yaml
    set:
      betterdb.existingSecret: mine
      betterdb.ca: |
        -----BEGIN CERTIFICATE-----
        MIIB
        -----END CERTIFICATE-----
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-betterdb-openeverest-ca
      - matchRegex:
          path: stringData["ca.crt"]
          pattern: BEGIN CERTIFICATE

  - it: keeps the CA out of the settings Secret when both are inline
    template: templates/secret.yaml
    set:
      betterdb.url: wss://x/agent/ws
      betterdb.token: t
      betterdb.ca: PEM
    asserts:
      - hasDocuments:
          count: 2
      - notExists:
          path: stringData["ca.crt"]
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-betterdb-openeverest-ca
        documentIndex: 1

  - it: refuses an inline CA together with an existing CA Secret
    template: templates/secret.yaml
    set:
      betterdb.ca: PEM
      betterdb.existingCaSecret.name: corp-ca
    asserts:
      - failedTemplate:
          errorMessage: "set either betterdb.ca or betterdb.existingCaSecret.name, not both"
